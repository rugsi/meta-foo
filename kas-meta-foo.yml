header:
  version: 17

machine: qemuarm
target: foo-image

local_conf_header:
  default_section: |
    PATCHRESOLVE = "noop"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    DISTRO_FEATURES:forcevariable = "systemd usrmerge ext2 ipv4 vfat gobject-instrospection-data ldconfig multiarch"
    DISTRO_FEATURES_OPTED_OUT = "*"
    INIT_MANAGER = "systemd"

repos:
  meta-foo:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: master
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: master
    layers:
      meta-poky:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: master
    layers:
      bitbake: disabled

